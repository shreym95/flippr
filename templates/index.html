<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flippr - MP3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1625;
            --bg-gradient: linear-gradient(135deg, #1a1625 0%, #2d1f3f 100%);
            --surface: #2a2438;
            --surface-hover: #352d47;
            --border: #4a4058;
            --text: #f5f5f7;
            --text-secondary: #c4c4d4;
            --accent: #9b8fd9;
            --accent-hover: #b0a4e8;
            --accent-light: #c8bff0;
            --accent-subtle: rgba(155, 143, 217, 0.2);
            --accent-glow: rgba(155, 143, 217, 0.35);
            --success: #7ee8c0;
            --error: #ff8a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            padding: 60px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 48px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent-light);
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
        }

        body.url-mode .panel {
            background: #e8e3f0;
            border-color: #bfb5cc;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        body.url-mode .panel .mode-toggle {
            background: rgba(124, 111, 184, 0.15);
            border-color: #bfb5cc;
        }

        body.url-mode .panel .mode-btn {
            color: #4a4058;
        }

        body.url-mode .panel .mode-btn.active {
            background: #7c6fb8;
            color: white;
            box-shadow: 0 2px 12px rgba(124, 111, 184, 0.3);
        }

        body.url-mode .panel label {
            color: #6b5fa8;
        }

        body.url-mode .panel input[type="text"] {
            background: rgba(124, 111, 184, 0.08);
            border-color: #bfb5cc;
            color: #1a1625;
        }

        body.url-mode .panel input[type="text"]:focus {
            border-color: #7c6fb8;
            background: rgba(124, 111, 184, 0.12);
            box-shadow: 0 0 0 3px rgba(124, 111, 184, 0.15);
        }

        body.url-mode .panel input[type="text"]::placeholder {
            color: #6a5f78;
        }

        body.url-mode .panel .btn {
            background: #7c6fb8;
            box-shadow: 0 4px 16px rgba(124, 111, 184, 0.3);
        }

        body.url-mode .panel .btn:hover:not(:disabled) {
            background: #9283c7;
            box-shadow: 0 6px 20px rgba(124, 111, 184, 0.4);
        }

        body.url-mode .panel .btn-secondary {
            background: #d8d0e6;
            color: #6b5fa8;
            border-color: #bfb5cc;
        }

        body.url-mode .panel .btn-secondary:hover {
            background: rgba(124, 111, 184, 0.2);
            border-color: #7c6fb8;
            color: #6b5fa8;
        }

        body.url-mode .panel .video-preview {
            background: rgba(124, 111, 184, 0.08);
            border-color: #bfb5cc;
        }

        body.url-mode .panel .video-preview .result-title {
            color: #1a1625;
        }

        body.url-mode .panel .video-preview .result-meta {
            color: #4a4058;
        }

        body.url-mode .panel .video-preview .result-thumbnail {
            border-color: #bfb5cc;
        }

        body.url-mode .panel .result-item {
            background: rgba(124, 111, 184, 0.08);
            border-color: #bfb5cc;
        }

        body.url-mode .panel .result-item:hover {
            border-color: #7c6fb8;
            background: rgba(124, 111, 184, 0.15);
        }

        body.url-mode .panel .result-item.selected {
            border-color: #7c6fb8;
            background: rgba(124, 111, 184, 0.2);
            box-shadow: 0 0 0 3px rgba(124, 111, 184, 0.1);
        }

        body.url-mode .panel .result-title {
            color: #1a1625;
        }

        body.url-mode .panel .result-meta {
            color: #4a4058;
        }

        body.url-mode .panel .result-thumbnail {
            border-color: #bfb5cc;
        }

        body.url-mode .panel .status.info {
            background: rgba(124, 111, 184, 0.15);
            border-left-color: #7c6fb8;
            color: #6b5fa8;
        }

        body.url-mode .panel .status.success {
            background: rgba(94, 192, 148, 0.15);
            border-left-color: #5ec094;
            color: #4a9675;
        }

        body.url-mode .panel .status.error {
            background: rgba(212, 106, 106, 0.15);
            border-left-color: #d46a6a;
            color: #b85555;
        }

        body.url-mode .panel .divider {
            background: linear-gradient(90deg, transparent, #bfb5cc, transparent);
        }

        body.url-mode .panel .loading-spinner {
            border-color: rgba(0, 0, 0, 0.15);
            border-top-color: #7c6fb8;
        }

        body.url-mode .panel .progress-bar {
            background: rgba(124, 111, 184, 0.15);
        }

        body.url-mode .panel .progress-fill {
            background: #7c6fb8;
        }

        .mode-toggle {
            display: inline-flex;
            background: rgba(155, 143, 217, 0.12);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px;
            margin-bottom: 32px;
            transition: all 0.4s ease;
        }

        .mode-btn {
            padding: 8px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--accent-light);
            margin-bottom: 8px;
            transition: color 0.4s ease;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(155, 143, 217, 0.08);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(155, 143, 217, 0.15);
            box-shadow: 0 0 0 3px var(--accent-subtle);
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .input-with-button {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-hover);
            box-shadow: 0 6px 20px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background: var(--surface-hover);
            color: var(--accent-light);
            border: 1px solid var(--border);
            padding: 12px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: var(--accent-subtle);
            border-color: var(--accent);
            color: white;
        }

        .video-preview {
            background: rgba(155, 143, 217, 0.08);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 24px;
            display: none;
            gap: 16px;
            transition: all 0.4s ease;
        }

        .video-preview.show {
            display: flex;
        }

        .search-results {
            margin-top: 24px;
            display: none;
        }

        .search-results.show {
            display: block;
        }

        .result-item {
            background: rgba(155, 143, 217, 0.08);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .result-item:hover {
            border-color: var(--accent);
            background: var(--accent-subtle);
            transform: translateX(4px);
        }

        .result-item.selected {
            border-color: var(--accent-light);
            background: var(--accent-subtle);
            box-shadow: 0 0 0 3px rgba(155, 143, 217, 0.15);
        }

        .result-thumbnail {
            width: 120px;
            height: 68px;
            border-radius: 3px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border);
            transition: border-color 0.4s ease;
        }

        .result-info {
            flex: 1;
            min-width: 0;
        }

        .result-title {
            font-size: 0.9375rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.4s ease;
        }

        .result-meta {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            transition: color 0.4s ease;
        }

        .progress-bar {
            height: 3px;
            background: rgba(155, 143, 217, 0.2);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
            transition: all 0.4s ease;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            margin-top: 20px;
            padding: 12px 16px;
            background: var(--accent-subtle);
            border-left: 3px solid var(--accent);
            border-radius: 3px;
            font-size: 0.875rem;
            display: none;
            transition: all 0.4s ease;
        }

        .status.error {
            background: rgba(255, 138, 138, 0.15);
            border-left-color: var(--error);
            color: var(--error);
        }

        .status.success {
            background: rgba(126, 232, 192, 0.15);
            border-left-color: var(--success);
            color: var(--success);
        }

        .status.info {
            color: var(--accent-light);
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .url-mode-content, .search-mode-content {
            display: none;
        }

        .url-mode-content.active, .search-mode-content.active {
            display: block;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 32px 0;
            transition: background 0.4s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Flippr</h1>
            <div class="subtitle">Convert YouTube videos to high-quality MP3</div>
        </div>

        <div class="panel">
            <div class="mode-toggle">
                <button class="mode-btn active" id="searchModeBtn">Search</button>
                <button class="mode-btn" id="urlModeBtn">URL</button>
            </div>

            <form id="downloadForm">
                <!-- Search Mode -->
                <div class="search-mode-content active" id="searchMode">
                    <div class="input-group">
                        <label for="searchQuery">Search YouTube</label>
                        <input type="text" id="searchQuery" placeholder="Song name or artist">
                    </div>

                    <button type="button" class="btn" id="searchBtn">Search</button>

                    <div class="search-results" id="searchResults"></div>
                </div>

                <!-- URL Mode -->
                <div class="url-mode-content" id="urlMode">
                    <div class="input-group">
                        <label for="url">Video URL</label>
                        <input type="text" id="url" placeholder="https://youtube.com/watch?v=...">
                    </div>

                    <div class="video-preview" id="videoPreview"></div>
                </div>

                <div class="divider"></div>

                <!-- Download location -->
                <div class="input-group">
                    <label for="path">Save Location</label>
                    <div class="input-with-button">
                        <input type="text" id="path" placeholder="Default: Downloads folder" style="flex: 1;">
                        <button type="button" class="btn-secondary" id="selectPath">Browse</button>
                    </div>
                </div>

                <button type="submit" class="btn" id="downloadBtn">
                    Download MP3
                </button>
            </form>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const searchQuery = document.getElementById('searchQuery');
        const urlInput = document.getElementById('url');
        const pathInput = document.getElementById('path');
        const selectPathBtn = document.getElementById('selectPath');
        const searchBtn = document.getElementById('searchBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const searchResults = document.getElementById('searchResults');
        const videoPreview = document.getElementById('videoPreview');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        
        const searchModeBtn = document.getElementById('searchModeBtn');
        const urlModeBtn = document.getElementById('urlModeBtn');
        const searchMode = document.getElementById('searchMode');
        const urlMode = document.getElementById('urlMode');

        let selectedVideoUrl = null;

        // Mode switching
        searchModeBtn.addEventListener('click', () => {
            searchModeBtn.classList.add('active');
            urlModeBtn.classList.remove('active');
            searchMode.classList.add('active');
            urlMode.classList.remove('active');
            document.body.classList.remove('url-mode');
            videoPreview.classList.remove('show');
            selectedVideoUrl = null;
        });

        urlModeBtn.addEventListener('click', () => {
            urlModeBtn.classList.add('active');
            searchModeBtn.classList.remove('active');
            urlMode.classList.add('active');
            searchMode.classList.remove('active');
            document.body.classList.add('url-mode');
            searchResults.classList.remove('show');
            selectedVideoUrl = null;
        });

        // URL input handler to fetch video info
        let urlTimeout;
        urlInput.addEventListener('input', () => {
            clearTimeout(urlTimeout);
            videoPreview.classList.remove('show');
            
            const url = urlInput.value.trim();
            if (url && (url.includes('youtube.com') || url.includes('youtu.be'))) {
                urlTimeout = setTimeout(() => {
                    fetchVideoInfo(url);
                }, 500);
            }
        });

        async function fetchVideoInfo(url) {
            try {
                const response = await fetch('/api/info', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url }),
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                const duration = data.duration ? formatDuration(data.duration) : 'Unknown';
                
                videoPreview.innerHTML = `
                    <img src="${data.thumbnail}" alt="${data.title}" class="result-thumbnail">
                    <div class="result-info">
                        <div class="result-title">${data.title}</div>
                        <div class="result-meta">
                            ${data.uploader || 'Unknown'} • ${duration}
                        </div>
                    </div>
                `;
                videoPreview.classList.add('show');
            } catch (error) {
                console.error('Error fetching video info:', error);
            }
        }

        // Search functionality
        searchBtn.addEventListener('click', async () => {
            const query = searchQuery.value.trim();
            
            if (!query) {
                showStatus('Please enter a search query', 'error');
                return;
            }

            searchBtn.disabled = true;
            searchBtn.innerHTML = '<span class="loading-spinner"></span>Searching...';
            searchResults.innerHTML = '';
            searchResults.classList.remove('show');
            hideStatus();

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query }),
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                if (data.results && data.results.length > 0) {
                    displaySearchResults(data.results);
                    searchResults.classList.add('show');
                } else {
                    showStatus('No results found', 'error');
                }

            } catch (error) {
                showStatus(`Search error: ${error.message}`, 'error');
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerHTML = 'Search';
            }
        });

        function displaySearchResults(results) {
            searchResults.innerHTML = results.map(result => {
                const duration = result.duration ? formatDuration(result.duration) : 'Unknown';
                const views = result.view_count ? formatViews(result.view_count) : '';
                
                return `
                    <div class="result-item" data-url="${result.url}">
                        <img src="${result.thumbnail}" alt="${result.title}" class="result-thumbnail">
                        <div class="result-info">
                            <div class="result-title">${result.title}</div>
                            <div class="result-meta">
                                ${result.uploader || 'Unknown'} • ${duration}${views ? ' • ' + views : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Add click handlers
            document.querySelectorAll('.result-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.result-item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedVideoUrl = item.dataset.url;
                    hideStatus();
                });
            });
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function formatViews(views) {
            if (views >= 1000000) {
                return (views / 1000000).toFixed(1) + 'M views';
            } else if (views >= 1000) {
                return (views / 1000).toFixed(1) + 'K views';
            }
            return views + ' views';
        }

        // Handle directory selection
        selectPathBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/select-folder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                const data = await response.json();
                
                if (data.error) {
                    showStatus(`Error: ${data.error}`, 'error');
                } else if (data.path) {
                    pathInput.value = data.path;
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        });

        function showStatus(message, type = 'info') {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function hideStatus() {
            status.style.display = 'none';
        }

        function showProgress() {
            progressBar.classList.add('show');
            let width = 0;
            const interval = setInterval(() => {
                width += 2;
                if (width >= 90) {
                    clearInterval(interval);
                } else {
                    progressFill.style.width = width + '%';
                }
            }, 100);
            return interval;
        }

        function completeProgress(interval) {
            clearInterval(interval);
            progressFill.style.width = '100%';
            setTimeout(() => {
                progressBar.classList.remove('show');
                progressFill.style.width = '0%';
            }, 500);
        }

        function hideProgress(interval) {
            clearInterval(interval);
            progressBar.classList.remove('show');
            progressFill.style.width = '0%';
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const path = pathInput.value.trim();
            let videoUrl;

            // Determine which mode we're in
            if (searchMode.classList.contains('active')) {
                if (!selectedVideoUrl) {
                    showStatus('Please select a video from the search results', 'error');
                    return;
                }
                videoUrl = selectedVideoUrl;
            } else {
                videoUrl = urlInput.value.trim();
                if (!videoUrl) {
                    showStatus('Please enter a YouTube URL', 'error');
                    return;
                }
            }

            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<span class="loading-spinner"></span>Converting...';
            hideStatus();
            
            const progressInterval = showProgress();

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: videoUrl, path }),
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                completeProgress(progressInterval);
                showStatus(`Downloaded: ${data.filename}`, 'success');
                setTimeout(() => {
                    showStatus(`Saved to: ${data.path}`, 'success');
                }, 100);
                
            } catch (error) {
                hideProgress(progressInterval);
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = 'Download MP3';
            }
        });

        // Allow enter key to trigger search
        searchQuery.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchBtn.click();
            }
        });
    </script>
</body>
</html>
